name: Build Flatpak Bundle

on:
  push:
    branches:
      - flathub
    tags:
      - 'v*.*.*-flathub'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Flatpak
        run: |
          sudo add-apt-repository -y ppa:flathub/external-ci
          sudo apt update
          sudo apt install -y flatpak flatpak-builder locales-all

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --if-not-exists flathub-kde https://kderab.github.io/flatpak-kde-applications/flatpak-kde-applications-main.flatpakrepo || true

      - name: Install Freedesktop SDK extensions
        run: |
          flatpak install -y org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install -y org.freedesktop.Sdk.Extension.node24

      - name: Generate NPM sources (if not present)
        run: |
          if [ ! -f generated-sources.json ]; then
            pip3 install flatpak-builder-tools
            flatpak-node-generator --quiet --no-platform --output generated-sources.json npm package-lock.json
          fi

      - name: Build Flatpak app
        run: |
          flatpak-builder --user --install --force-clean \
            --repo=repo \
            --arch=x86_64 \
            build-dir \
            io.github.ribaudequin.epub-library-manager.yml

      - name: Export bundle
        run: |
          flatpak build-export --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo/
          flatpak build-bundle \
            --repo=repo \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            BibliotecaEpub-1.8.0.flatpak \
            io.github.ribaudequin.epub-library-manager

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.8.0-flathub' }}
          name: 'BibliotecaEpub 1.8.0 (Flatpak)'
          body: |
            ## Installation
            
            ```bash
            flatpak install --user BibliotecaEpub-1.8.0.flatpak
            ```
            
            Or after adding Flathub:
            
            ```bash
            flatpak install flathub io.github.ribaudequin.epub-library-manager
            ```
          files: BibliotecaEpub-1.8.0.flatpak
          generate_release_notes: false
          fail_on_unmatched_files: false
