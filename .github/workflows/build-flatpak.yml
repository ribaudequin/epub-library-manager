name: Build Flatpak bundle

# Deliberately NOT triggered by 'v*' tags: release.yml already publishes a
# release for every version tag, and two workflows racing to create the same
# release would collide. This one builds the bundle on demand and on pushes to
# the flathub branch that touch the packaging files.
on:
  workflow_dispatch:
  push:
    branches:
      - flathub
    paths:
      - 'io.github.ribaudequin.epub-library-manager.yml'
      - 'io.github.ribaudequin.epub-library-manager.desktop'
      - 'io.github.ribaudequin.epub-library-manager.metainfo.xml'
      - 'generated-sources.json'
      - 'run.sh'
      - '.github/workflows/build-flatpak.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The previous version of this workflow never called flatpak-builder at
      # all: it copied files into /app by hand and ran `flatpak build-export` on
      # that, which is not a build and could never produce a working bundle.
      # This action runs flatpak-builder properly, in a sandbox with no network,
      # and uploads the bundle as an artifact itself.
      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.ribaudequin.epub-library-manager.yml
          bundle: EPUBShelf.flatpak
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: EPUBShelf-flatpak
          verbose: true

      # A bundle whose metadata does not validate would be rejected by Flathub.
      # Cheap to check here, and it keeps the manifest honest.
      - name: Validate AppStream metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream
          appstreamcli validate --no-net \
            io.github.ribaudequin.epub-library-manager.metainfo.xml
