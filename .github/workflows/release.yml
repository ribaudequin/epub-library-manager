name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Typecheck
        run: npm run typecheck || true

      - name: Test
        run: npm test || true

  build:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Windows — skip native rebuild, use prebuilds)
        if: runner.os == 'Windows'
        run: npm ci --ignore-scripts

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: npm ci

      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install Linux Tauri dependencies (Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: Build application (Tauri)
        run: |
          cd tauri-app
          npm ci
          npm run build

      - name: List build output
        shell: bash
        run: find tauri-app/src-tauri/target/release/bundle -type f 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            tauri-app/src-tauri/target/release/bundle/**/*.deb
            tauri-app/src-tauri/target/release/bundle/**/*.rpm
            tauri-app/src-tauri/target/release/bundle/**/*.AppImage
            tauri-app/src-tauri/target/release/bundle/**/*.msi
            tauri-app/src-tauri/target/release/bundle/**/*.exe
            tauri-app/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: biblioteca-*-${{ github.ref_name }}
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: find dist -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
