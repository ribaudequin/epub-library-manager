[package]
name = "epub-shelf"
version = "1.9.18"
description = "EPUB Shelf — gestor de biblioteca EPUB por séries"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
quick-xml = { version = "0.31", features = ["serialize"] }
walkdir = "2"
image = "0.24"
base64 = "0.21"
tokio = { version = "1", features = ["fs", "io-util", "macros"] }
dirs = "5"

[features]
# Enabled by `tauri build` for production builds. Do not remove.
custom-protocol = ["tauri/custom-protocol"]
