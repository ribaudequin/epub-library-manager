<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2A2E" />
    <title>EPUBShelf</title>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
   <header>
      <h1 id="app-title">EPUBShelf</h1>
     <div class="actions">
       <div class="search-box">
         <label for="search-input" class="visually-hidden" id="search-label"></label>
         <input type="search" id="search-input" class="input--search" autocomplete="off" oninput="onSearchInput()" />
         <button type="button" id="search-clear" class="btn--clear" aria-hidden="true">✕</button>
       </div>
       <label for="sort-select" class="visually-hidden" id="sort-label"></label>
       <select id="sort-select" class="select--sort">
         <option value="name-asc" id="opt-name-asc"></option>
         <option value="name-desc" id="opt-name-desc"></option>
         <option value="progress-desc" id="opt-progress"></option>
         <option value="mtime-desc" id="opt-mtime"></option>
          <option value="favorite" id="opt-favorite"></option>
       </select>
        <button id="btn-theme-toggle"></button>
        <button id="btn-stats"></button>
        <button id="btn-about"></button>
        <button id="btn-select"></button>
       <button id="btn-scan" class="hidden"></button>
       <span id="search-info" class="search-info" aria-live="polite"></span>
 </div>
    </header>

    <main>
    <div id="empty-state" class="hidden">
          <p id="empty-title"></p>
          <p id="empty-desc"></p>
        </div>

    <div id="loading-state" class="hidden">
      <div class="loading-grid" id="loading-grid"></div>
      <div class="loading-progress-container">
        <p id="loading-text" aria-live="polite"></p>
        <div class="loading-bar-container">
          <div class="loading-progress" id="loading-progress"></div>
        </div>
      </div>
      <div class="loading-brand">
        <img src="bandua-icon.svg" alt="Bandua Studio" class="loading-logo" />
        <p class="loading-tagline">Built by Bandua Studio.</p>
      </div>
    </div>

        <section id="series-view" class="hidden">
          <div id="series-grid"></div>
        </section>

        <section id="series-detail" class="hidden">
          <button id="btn-back"></button>
          <div id="detail-header">
            <img id="detail-cover" class="placeholder" src="" alt="" />
            <div id="detail-meta">
              <h2 id="detail-title"></h2>
              <button id="btn-favorite" class="btn-fav"></button>
              <p id="detail-author"></p>
              <p id="detail-last-updated"></p>
              <p id="detail-count"></p>
              <p id="detail-read-count"></p>
              <div id="series-state-selector"></div>
              <div id="detail-progress">
                <div class="progress-bar">
                  <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="detail-progress-label"></span>
              </div>
            </div>
            <div id="detail-excerpt"></div>
          </div>
          <div id="volume-list"></div>

<button id="toggle-all-status" class="btn-status"></button>
        </section>
      </main>

  <script src="translations.js"></script>
  <script src="renderer.js"></script>

  <div id="stats-modal" class="hidden" role="dialog" tabindex="-1">
    <div class="stats-backdrop"></div>
    <div class="stats-panel">
      <div class="stats-header">
        <h2 id="stats-title"></h2>
        <button id="btn-stats-close"></button>
      </div>
      <div class="stats-body">
        <div class="stats-summary" id="stats-summary"></div>
        <div class="stats-charts" id="stats-charts"></div>
      </div>
    </div>
  </div>
  <div id="about-modal" class="hidden" role="dialog" tabindex="-1">
    <div class="about-backdrop"></div>
    <div class="about-panel">
      <div class="about-header">
        <h2 id="about-title"></h2>
        <button id="btn-about-close"></button>
      </div>
      <div class="about-body">
        <h3 class="about-app-name">EPUBShelf</h3>
        <p class="about-version">v2.2.3</p>
        <p class="about-desc" id="about-desc"></p>
        <p class="about-license">MIT License · <a href="https://github.com/ribaudequin/epub-library-manager/blob/master/LICENSE" id="about-license-link"></a></p>

        <div class="about-credits">
          <div class="about-studio">
            <img src="bandua-icon.svg" alt="Bandua Studio" class="about-studio-logo" />
            <p class="about-studio-line">A <strong>Bandua Studio</strong> app · by <strong>Marcelo Salvador</strong></p>
          </div>
          <div class="about-studio-profiles">
            <a href="#" id="about-x-link" class="about-chip"><img src="x.svg" alt="" class="about-chip-icon" />@banduastudio</a>
            <a href="#" id="about-linkedin-link" class="about-chip"><img src="linkedin.svg" alt="" class="about-chip-icon" />LinkedIn</a>
          </div>
        </div>

        <div class="about-support">
          <p class="about-support-text" id="about-support-text"></p>
          <div class="about-support-buttons">
            <a href="#" id="about-kofi-link" class="about-cta"><img src="kofi-light.svg" alt="" class="about-cta-icon" /><span id="about-kofi-text"></span></a>
            <a href="#" id="about-patreon-link" class="about-cta"><img src="patreon.svg" alt="" class="about-cta-icon" /><span id="about-patreon-text"></span></a>
          </div>
        </div>

        <div class="about-crypto">
          <h5 id="about-crypto-title"></h5>
          <p class="about-crypto-note" id="about-crypto-note"></p>
          <div class="crypto-row">
            <span class="crypto-label">ETH</span>
            <code class="crypto-addr" translate="no">0x466f0c3ee495a3dc851fafa5c4720ab2fdcd4af4</code>
            <button class="crypto-copy" data-addr="0x466f0c3ee495a3dc851fafa5c4720ab2fdcd4af4" aria-label="" id="copy-eth-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crypto-copy-icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crypto-copy-check"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
          <p class="crypto-explorer"><a href="https://etherscan.io/address/0x466f0c3ee495a3dc851fafa5c4720ab2fdcd4af4" id="about-etherscan-link">Etherscan</a></p>
          <div class="crypto-row">
            <span class="crypto-label">SOL</span>
            <code class="crypto-addr" translate="no">Hnw5z47sk1hS6FsnCLfgX8pZhDryQVnZpzWJjSSRV5Nf</code>
            <button class="crypto-copy" data-addr="Hnw5z47sk1hS6FsnCLfgX8pZhDryQVnZpzWJjSSRV5Nf" aria-label="" id="copy-sol-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crypto-copy-icon"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="crypto-copy-check"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
          <p class="crypto-explorer"><a href="https://solscan.io/account/Hnw5z47sk1hS6FsnCLfgX8pZhDryQVnZpzWJjSSRV5Nf" id="about-solscan-link">Solscan</a></p>
        </div>

        <div class="about-links-row">
          <a href="#" id="about-github-link" class="about-chip"><img src="github-dark.svg" alt="" class="about-chip-icon" /><span id="about-github-text"></span></a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
